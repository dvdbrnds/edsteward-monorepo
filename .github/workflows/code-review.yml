name: Automated Code Review

on:
  pull_request:
    branches: [main, staging, dev, ES-clientside]
  push:
    branches: [main, staging, dev, ES-clientside]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Code Quality Analysis
  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality Analysis

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Run Prettier check
        run: npm run format:check
        continue-on-error: true

      - name: TypeScript check
        run: npm run type-check
        continue-on-error: true

  # Security Analysis
  security-analysis:
    runs-on: ubuntu-latest
    name: Security Analysis

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run security linting
        run: npm run lint
        continue-on-error: true

  # Comprehensive Testing
  testing:
    runs-on: ubuntu-latest
    name: Comprehensive Testing

    strategy:
      matrix:
        test-type: [unit, integration, e2e]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests
        if: matrix.test-type == 'unit'
        run: npm run test:unit

      - name: Run integration tests
        if: matrix.test-type == 'integration'
        run: npm run test:integration

      - name: Run E2E tests
        if: matrix.test-type == 'e2e'
        run: |
          npm run build
          npm run test:e2e

      - name: Upload coverage reports
        if: matrix.test-type == 'unit'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Build Validation
  build-validation:
    runs-on: ubuntu-latest
    name: Build Validation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Check build artifacts
        run: |
          ls -la dist/

  # Performance Analysis
  performance-analysis:
    runs-on: ubuntu-latest
    name: Performance Analysis
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build application
        run: npm run build

      - name: Run bundle analyzer
        run: |
          npm install -g webpack-bundle-analyzer
          npx webpack-bundle-analyzer dist/static/js/*.js --report --mode static --report-filename bundle-report.html

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: bundle-report.html

  # Dependency Analysis
  dependency-analysis:
    runs-on: ubuntu-latest
    name: Dependency Analysis

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check for outdated packages
        run: npm outdated || true

      - name: License compliance check
        run: |
          npm install -g license-checker
          license-checker --summary

      - name: Dependency tree analysis
        run: npm ls --depth=0

  # Code Review Summary
  code-review-summary:
    runs-on: ubuntu-latest
    name: Code Review Summary
    needs: [code-quality, security-analysis, testing, build-validation]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate review summary
        run: |
          echo "## 🔍 Automated Code Review Summary" >> $GITHUB_STEP_SUMMARY
          echo "### Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "### Security Analysis: ${{ needs.security-analysis.result }}" >> $GITHUB_STEP_SUMMARY
          echo "### Testing: ${{ needs.testing.result }}" >> $GITHUB_STEP_SUMMARY
          echo "### Build Validation: ${{ needs.build-validation.result }}" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.code-quality.result }}" == "success" && "${{ needs.security-analysis.result }}" == "success" && "${{ needs.testing.result }}" == "success" && "${{ needs.build-validation.result }}" == "success" ]]; then
            echo "### ✅ All checks passed! Ready for review." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Some checks failed. Please review the issues above." >> $GITHUB_STEP_SUMMARY
          fi

  # Comment on PR with results
  pr-comment:
    runs-on: ubuntu-latest
    name: PR Comment
    needs: [code-quality, security-analysis, testing, build-validation]
    if: github.event_name == 'pull_request' && always()

    steps:
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              codeQuality: '${{ needs.code-quality.result }}',
              security: '${{ needs.security-analysis.result }}',
              testing: '${{ needs.testing.result }}',
              build: '${{ needs.build-validation.result }}'
            };

            const getEmoji = (result) => {
              switch(result) {
                case 'success': return '✅';
                case 'failure': return '❌';
                case 'skipped': return '⏭️';
                default: return '⚠️';
              }
            };

            const body = `
            ## 🤖 Automated Code Review

            | Check | Status |
            |-------|--------|
            | Code Quality | ${getEmoji(results.codeQuality)} ${results.codeQuality} |
            | Security | ${getEmoji(results.security)} ${results.security} |
            | Testing | ${getEmoji(results.testing)} ${results.testing} |
            | Build | ${getEmoji(results.build)} ${results.build} |

            ${Object.values(results).every(r => r === 'success') 
              ? '🎉 All automated checks passed! This PR is ready for human review.' 
              : '⚠️ Some automated checks need attention. Please review the workflow details.'}

            ---
            *This comment was generated by automated code review workflow*
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
