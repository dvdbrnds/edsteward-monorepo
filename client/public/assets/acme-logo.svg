<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <defs>
    <linearGradient id="acmeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef390b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c42d08;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Eye/Football shape background -->
  <ellipse cx="100" cy="50" rx="90" ry="40" fill="none" stroke="#ef390b" stroke-width="3"/>
  <ellipse cx="100" cy="50" rx="80" ry="32" fill="url(#acmeGrad)"/>
  <!-- ACME Text -->
  <text x="100" y="58" font-family="Arial Black, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">ACME</text>
</svg>
