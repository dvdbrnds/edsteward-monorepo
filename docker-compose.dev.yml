services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://neondb_owner:npg_foSr6ixkzw7W@ep-weathered-term-a5rmi9cx-pooler.us-east-2.aws.neon.tech/neondb?sslmode=require
      - DB_HOST=ep-weathered-term-a5rmi9cx-pooler.us-east-2.aws.neon.tech
      - DB_PORT=5432
      - DB_NAME=neondb
      - DB_USER=neondb_owner
      - DB_PASSWORD=npg_foSr6ixkzw7W
      - DB_SSL=true
      - SESSION_SECRET=dev-secret-key-for-local-development-only
      - HOSTNAME=0.0.0.0
      - PORT=3000
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m
    # Allow access from all local domains
    extra_hosts:
      - "edsteward.local:127.0.0.1"
      - "admin.edsteward.local:127.0.0.1"  
      - "moravian.edsteward.local:127.0.0.1"
