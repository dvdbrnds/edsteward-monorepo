services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Staging Configuration
      - NODE_ENV=staging
      - PORT=3000
      
      # Database Configuration (local test DB)
      - DATABASE_URL=postgresql://testuser:testpass@postgres:5432/testdb
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=testdb
      - DB_USER=testuser
      - DB_PASSWORD=testpass
      
      # Multi-tenant Configuration
      - BASE_DOMAIN=localhost
      - ENABLE_MULTI_TENANCY=false
      - TENANT_CACHE_TTL=300000
      
      # Session Configuration
      - SESSION_SECRET=local-staging-secret-key-12345
      - REDIS_URL=redis://redis:6379
      
      # Disable external integrations for local staging
      - DISABLE_EXTERNAL_APIS=true
      - SKIP_SSL_VERIFY=true
      
      # Logging
      - LOG_LEVEL=debug
      
    depends_on:
      - redis
      - postgres
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - staging-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - staging-network
    command: redis-server --appendonly yes
    volumes:
      - redis-staging-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=testdb
      - POSTGRES_USER=testuser
      - POSTGRES_PASSWORD=testpass
      - POSTGRES_HOST_AUTH_METHOD=trust
    networks:
      - staging-network
    volumes:
      - postgres-staging-data:/var/lib/postgresql/data
      - ./sql_dump:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Test runner for automated tests
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=test
      - DATABASE_URL=postgresql://testuser:testpass@postgres:5432/testdb
      - REDIS_URL=redis://redis:6379
      - TEST_MODE=true
    depends_on:
      - app
      - postgres
      - redis
    networks:
      - staging-network
    command: ["sh", "-c", "sleep 30 && npm test"]
    profiles:
      - testing

volumes:
  redis-staging-data:
    driver: local
  postgres-staging-data:
    driver: local

networks:
  staging-network:
    driver: bridge 