apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: mcp-engine
  labels:
    app: llm-gateway
    component: api
    phase: "5"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: llm-gateway
  template:
    metadata:
      labels:
        app: llm-gateway
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3002"
        prometheus.io/path: "/api/llm/metrics"
    spec:
      containers:
      - name: llm-gateway
        image: mcp-engine/llm-gateway:phase4-latest
        ports:
        - containerPort: 3002
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: LLM_GATEWAY_PORT
          value: "3002"
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: password
        - name: REDIS_DB
          value: "0"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-secrets
              key: openai-api-key
        - name: LOG_LEVEL
          value: "info"
        - name: ENABLE_METRICS
          value: "true"
        - name: ENABLE_AUTH
          value: "true"
        - name: ENABLE_RATE_LIMITING
          value: "true"
        - name: CACHE_TTL
          value: "3600"
        - name: MAX_BULK_SIZE
          value: "1000"
        - name: METRICS_RETENTION_DAYS
          value: "30"
        - name: KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: data
          mountPath: /app/data
        - name: config
          mountPath: /app/config/k8s
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /api/llm/health
            port: 3002
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/llm/health
            port: 3002
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/llm/health
            port: 3002
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 10
      volumes:
      - name: logs
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: llm-gateway-pvc
      - name: config
        configMap:
          name: llm-gateway-config
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - llm-gateway
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway-service
  namespace: mcp-engine
  labels:
    app: llm-gateway
    component: api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3002"
    prometheus.io/path: "/api/llm/metrics"
spec:
  selector:
    app: llm-gateway
  ports:
  - port: 3002
    targetPort: 3002
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-gateway-pvc
  namespace: mcp-engine
  labels:
    app: llm-gateway
    component: api
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: fast-ssd
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-gateway-config
  namespace: mcp-engine
  labels:
    app: llm-gateway
    component: api
data:
  k8s-config.json: |
    {
      "kubernetes": {
        "enabled": true,
        "namespace": "mcp-engine",
        "serviceName": "llm-gateway-service",
        "podSelector": "app=llm-gateway"
      },
      "monitoring": {
        "prometheus": {
          "enabled": true,
          "metricsPath": "/api/llm/metrics",
          "scrapeInterval": "30s"
        },
        "jaeger": {
          "enabled": true,
          "endpoint": "http://jaeger-collector:14268/api/traces"
        }
      },
      "cache": {
        "redis": {
          "cluster": false,
          "sentinel": false,
          "keyPrefix": "mcp:k8s:"
        }
      },
      "security": {
        "cors": {
          "origin": ["https://mcp-engine.com", "https://*.mcp-engine.com"],
          "credentials": true
        },
        "rateLimit": {
          "windowMs": 900000,
          "max": 1000,
          "standardHeaders": true,
          "legacyHeaders": false
        }
      }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: llm-secrets
  namespace: mcp-engine
  labels:
    app: llm-gateway
    component: api
type: Opaque
data:
  openai-api-key: c2stcHJvamVjdC1leGFtcGxlLWtleQ== # sk-project-example-key (base64)
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llm-gateway-hpa
  namespace: mcp-engine
  labels:
    app: llm-gateway
    component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llm-gateway
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max 