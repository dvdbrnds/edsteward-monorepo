apiVersion: v1
kind: Namespace
metadata:
  name: mcp-engine
  labels:
    name: mcp-engine
    phase: "5"
    environment: production
    app.kubernetes.io/name: mcp-engine
    app.kubernetes.io/version: "5.0.0"
    app.kubernetes.io/component: namespace
    app.kubernetes.io/part-of: mcp-platform
    app.kubernetes.io/managed-by: helm
  annotations:
    description: "MCP Engine Phase 5 - Enterprise Kubernetes & Advanced Operations"
    contact: "devops@mcp-engine.com"
    cost-center: "engineering"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mcp-engine-quota
  namespace: mcp-engine
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: "10"
    services: "10"
    secrets: "20"
    configmaps: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: mcp-engine-limits
  namespace: mcp-engine
spec:
  limits:
  - default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    type: Container
  - max:
      cpu: "2"
      memory: "4Gi"
    min:
      cpu: "50m"
      memory: "64Mi"
    type: Container 