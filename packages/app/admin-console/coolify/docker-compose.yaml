# =============================================================================
# EdSteward Admin Console - Coolify Docker Compose
# =============================================================================
# Deploy this as a separate Coolify project.
#
# The admin console connects to the same PostgreSQL used by the main EdSteward
# app. It does NOT include its own database -- you must set DATABASE_URL to
# point to the production EdSteward PostgreSQL instance.
#
# After deploying:
#   1. Set FQDN on 'admin-frontend' service (e.g., admin.edsteward.ai)
#   2. Set DATABASE_URL in Coolify UI to the main EdSteward PostgreSQL
#   3. Set REGISTRY_API_SECRET to match the main app's value
# =============================================================================

services:
  admin-backend:
    build:
      context: ..
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - ADMIN_PORT=4000
      # -- Set in Coolify UI --
      # DATABASE_URL=            (required -- point to the main EdSteward PostgreSQL)
      # SESSION_SECRET=          (required)
      # REGISTRY_API_SECRET=     (required -- must match main app)
    ports:
      - "9400:4000"
    depends_on:
      admin-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  admin-frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    environment:
      - VITE_ADMIN_API_URL=http://admin-backend:4000
    ports:
      - "9001:3001"
    depends_on:
      - admin-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  admin-redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
