
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdSteward - SAML Login</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo h1 {
            color: #2d3748;
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
        }
        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 2rem;
        }
        .saml-providers {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .saml-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 1rem 1.5rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            text-decoration: none;
            color: #2d3748;
            font-weight: 600;
            transition: all 0.2s;
            background: white;
        }
        .saml-button:hover {
            border-color: #667eea;
            background: #f7fafc;
            transform: translateY(-1px);
        }
        .provider-icon {
            width: 24px;
            height: 24px;
            border-radius: 4px;
        }
        .okta { background: #007dc1; }
        .shibboleth { background: #8b5a3c; }
        .incommon { background: #1a365d; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>EdSteward</h1>
        </div>
        <div class="subtitle">
            Select your identity provider to sign in
        </div>
        <div class="saml-providers">
            <a href="/auth/saml/okta" class="saml-button">
                <div class="provider-icon okta"></div>
                Sign in with Okta
            </a>
            <a href="/auth/saml/shibboleth-idp" class="saml-button">
                <div class="provider-icon shibboleth"></div>
                Sign in with Shibboleth
            </a>
            <a href="/auth/saml/incommon-federation" class="saml-button">
                <div class="provider-icon incommon"></div>
                Sign in with InCommon
            </a>
        </div>
    </div>
</body>
</html>
