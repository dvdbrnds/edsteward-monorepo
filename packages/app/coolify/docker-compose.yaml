# =============================================================================
# EdSteward - Coolify Docker Compose
# =============================================================================
# Core app only. Engine + Admin services are commented out below.
# Uncomment them once the app is stable and properly configured.
#
# After deploying:
#   1. Set FQDN on 'app' service (e.g., edsteward.moravian.edu)
#   2. Set environment variables in Coolify UI
#   3. Configure PostgreSQL backups
# =============================================================================

services:

  # ===========================================================================
  # EdSteward App
  # ===========================================================================
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DEPLOYMENT_MODE=coolify
      - DOCKER_CONTAINER=true
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://${DB_USER:-edsteward}:${DB_PASSWORD:-edsteward_secure_2026}@postgres:5432/${DB_NAME:-edsteward}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_2026}@redis:6379
      - MULTI_TENANT=false
      - ENABLE_TASK_SCHEDULER=false
      # -- Set in Coolify UI --
      # SESSION_SECRET=
      # MFA_ENCRYPTION_KEY=
      # ATTESTATION_JWT_SECRET=
      # INSTITUTION_NAME=        (e.g., "Moravian University")
      # INSTITUTION_DOMAIN=      (e.g., "moravian.edu")
      # BASE_URL=                (e.g., "https://edsteward.moravian.edu")
      # MCP_ENGINE_USERNAME=     (e.g., "mcp-engine")
      # MCP_ENGINE_PASSWORD=
      # AUTH_SAML_ENABLED=
      # OKTA_SSO_URL=
      # OKTA_CERT=
      # EMAIL_HOST=
      # EMAIL_PORT=
      # EMAIL_USER=
      # EMAIL_PASS=
      # EMAIL_FROM=
      # OPENAI_API_KEY=
      # ENABLE_TASK_SCHEDULER=true  (set to 'true' when email is configured)
    ports:
      - "9000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_uploads:/app/uploads
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # ===========================================================================
  # App PostgreSQL
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-edsteward}
      - POSTGRES_USER=${DB_USER:-edsteward}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-edsteward_secure_2026}
      - POSTGRES_HOST_AUTH_METHOD=md5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Uncomment for migration/admin access, re-comment after
    # ports:
    #   - "9432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-edsteward} -d ${DB_NAME:-edsteward}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===========================================================================
  # App Redis
  # ===========================================================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_2026}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_secure_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

