# =============================================================================
# EdSteward App - Coolify Docker Compose
# =============================================================================
# Deploy this as a Docker Compose resource in Coolify.
#
# Coolify handles:
#   - SSL termination (Traefik + Let's Encrypt)
#   - Domain routing (set FQDN on the 'app' service)
#   - Networking (auto-created shared network, no 'networks:' needed)
#   - Volume management
#   - Environment variable injection (secrets go in Coolify UI)
#
# After deploying:
#   1. Set FQDN on 'app' service (e.g., moravian.edsteward.ai)
#   2. Set environment variables in Coolify UI (see env.coolify.example)
#   3. Configure PostgreSQL backups in Coolify (Backups tab on 'postgres' resource)
#   4. Import database dump if migrating from Neon
# =============================================================================

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # -- Core --
      - NODE_ENV=production
      - PORT=3000
      - DEPLOYMENT_MODE=coolify
      - DOCKER_CONTAINER=true
      - HOSTNAME=0.0.0.0
      # Database (internal compose service)
      - DATABASE_URL=postgresql://${DB_USER:-edsteward}:${DB_PASSWORD:-edsteward_secure_2026}@postgres:5432/${DB_NAME:-edsteward}?sslmode=disable
      # Redis (internal compose service)
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_2026}@redis:6379
      # Multi-tenant disabled -- each customer is a separate Coolify project
      - MULTI_TENANT=false
      # -- Set these in Coolify UI (Environment Variables tab) --
      # SESSION_SECRET=          (required -- generate with: openssl rand -hex 32)
      # MFA_ENCRYPTION_KEY=      (recommended -- generate with: openssl rand -hex 32)
      # INSTITUTION_NAME=        (required -- e.g., "Moravian University")
      # INSTITUTION_DOMAIN=      (required -- e.g., "moravian.edu")
      # INSTITUTION_LOGO_URL=    (optional -- e.g., "/assets/logo.png")
      # INSTITUTION_PRIMARY_COLOR=   (optional -- e.g., "#003366")
      # INSTITUTION_SECONDARY_COLOR= (optional -- e.g., "#336699")
      # AUTH_SAML_ENABLED=       (optional -- "true" or "false")
      # AUTH_SAML_ENTITY_ID=     (required if SAML enabled)
      # AUTH_SAML_SSO_URL=       (required if SAML enabled)
      # BASE_URL=                (required if SAML enabled -- e.g., "https://moravian.edsteward.ai")
      # MCP_ENGINE_USERNAME=     (for engine push auth)
      # MCP_ENGINE_PASSWORD=     (for engine push auth)
      # EMAIL_HOST=              (SMTP host for notifications)
      # EMAIL_PORT=              (SMTP port, default 587)
      # EMAIL_USER=              (SMTP username)
      # EMAIL_PASS=              (SMTP password)
      # EMAIL_FROM=              (From address)
      # OPENAI_API_KEY=          (optional -- for AI features)
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_uploads:/app/uploads
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-edsteward}
      - POSTGRES_USER=${DB_USER:-edsteward}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-edsteward_secure_2026}
      - POSTGRES_HOST_AUTH_METHOD=md5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Expose PostgreSQL externally for migration/admin (remove after migration)
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-edsteward} -d ${DB_NAME:-edsteward}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_2026}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_secure_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  app_uploads:
  app_logs:
